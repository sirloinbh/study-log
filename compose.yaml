services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-study}
      POSTGRES_USER: ${POSTGRES_USER:-study}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set password}
      TZ: Asia/Seoul
    ports: ['127.0.0.1:15402:5432']
    volumes:
      - study-log-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: while a new volume is set up, the temporary server answers only on its socket, and
      # the migration step after this check connects over TCP.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    # deploy/remote-deploy.sh tags each build by commit, so a rollback starts the old images
    # without rebuilding.
    image: study-backend:${IMAGE_TAG:-local}
    build: { context: ./backend, secrets: [npm_token] }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-study}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-study}
      PORT: 3102
      TZ: Asia/Seoul
      # Exercise translation (#31); without it only translating fails.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Public holidays for schedules (#33); without it only reading holidays fails.
      HOLIDAY_API_KEY: ${HOLIDAY_API_KEY:-}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  web:
    image: study-frontend:${IMAGE_TAG:-local}
    build: { context: ./frontend, secrets: [npm_token] }
    # The server .env sets WEB_BIND and WEB_PORT; the deploy health check reads the same WEB_PORT.
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8102}:80']
    depends_on: [api]
    restart: unless-stopped
volumes:
  study-log-data:
# The Dockerfiles read the GitHub Packages token as a BuildKit secret, so it never lands in an image layer.
secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
