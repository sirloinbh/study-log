services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-study}
      POSTGRES_USER: ${POSTGRES_USER:-study}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set password}
      TZ: Asia/Seoul
    ports: ['127.0.0.1:15402:5432']
    volumes:
      - study-log-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: while a new volume is set up, the temporary server answers only on its socket, and
      # the migration step after this check connects over TCP.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped
  api:
    # deploy/remote-deploy.sh tags each build by commit, so a rollback starts the old images
    # without rebuilding.
    image: study-backend:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: backend/Dockerfile, secrets: [npm_token] }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-study}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-study}
      PORT: 3102
      TZ: Asia/Seoul
      # Exercise translation (#31); without it only translating fails.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Public holidays for schedules (#33); without it only reading holidays fails.
      HOLIDAY_API_KEY: ${HOLIDAY_API_KEY:-}
      # The solved.ac account to import from (#369); without it only the import fails.
      SOLVEDAC_HANDLE: ${SOLVEDAC_HANDLE:-}
      # The LeetCode account to import from (#370); without it only the import fails.
      LEETCODE_USERNAME: ${LEETCODE_USERNAME:-}
      # Exercise files in S3 (#28); without the bucket and region only file requests fail. Empty
      # keys fall through to the server's IAM role.
      FILE_BUCKET: ${FILE_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # #221: the shared sign-in (sirloinbh/shared-auth) checks each /api session on its network.
      AUTH_INTERNAL_URL: ${AUTH_INTERNAL_URL:-http://shared-auth-api:3110}
      # shared-ai's public key; /internal/tools is served only when it is set (project-standards docs/ai-tools.md).
      AI_TOOLS_PUBLIC_KEY: ${AI_TOOLS_PUBLIC_KEY:-}
    networks:
      default: {}
      shared-auth: {}
      # shared-ai reads this app's tools at http://study-log-api:3102/internal/tools (ADR-0017).
      shared-ai: { aliases: [study-log-api] }
    depends_on:
      db: { condition: service_healthy }
    # The image has no curl, so node asks the API itself. `docker compose up -d --wait` and web's depends_on use it.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3102/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
  web:
    image: study-frontend:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: frontend/Dockerfile, secrets: [npm_token] }
    # The server .env sets WEB_BIND and WEB_PORT; the deploy health check reads the same WEB_PORT.
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8102}:80']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  study-log-data:
# Created by the shared-auth compose project. Locally, run shared-auth first, or once: docker network create shared-auth
networks:
  shared-auth:
    external: true
  # Created by deploy/remote-deploy.sh or the shared-ai deploy when missing. Locally, once: docker network create shared-ai
  shared-ai:
    name: shared-ai
    external: true
# The Dockerfiles read the GitHub Packages token as a BuildKit secret, so it never lands in an image layer.
secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
