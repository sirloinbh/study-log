# Managed file. Edit it in sirloinbh/project-standards templates/app/.github/
# Dependabot is used for security updates only. It does not open version-bump PRs(open-pull-requests-limit: 0).
# Turn on security updates in the repo settings (Settings → Code security → Dependabot security updates).
# Version bumps happen only through sync PRs from the central repo (docs/design.md section 4).
# Each app has 3 lockfiles (root, frontend, backend), so the directories are grouped into one, and security updates are
# opened as only two PRs: a minor/patch group and a major group (#267). Majors need code review, so they are kept separate.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /frontend
      - /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security-minor-patch:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
      security-major:
        applies-to: security-updates
        patterns: ['*']
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
