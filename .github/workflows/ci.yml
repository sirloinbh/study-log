# 중앙 관리 파일. 수정은 sirloinbh/project-standards의 templates/app/.github/workflows/에서
# 중앙 공통 CI(reusable-app-ci)를 동기화한 중앙 커밋으로 고정해 호출한다. 값은 중앙 레지스트리와 versions.json에서 온다.
name: ci

on: [push, pull_request]

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: sirloinbh/project-standards/.github/workflows/reusable-app-ci.yml@f80624f0cb3fa9a891cd95fca1fbcf9d3db28091
    with:
      node-version: '24.21.0'
      npm-version: '11.19.0'
      postgres-image: 'postgres:17-alpine'
      db-name: 'study_test'
      e2e: false
      e2e-visual: false
      playwright-image: 'mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27'
