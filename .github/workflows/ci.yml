# Managed file. Edit it in sirloinbh/project-standards templates/app/.github/workflows/
# Calls the central shared CI (reusable-app-ci) pinned to the central commit that was synced. Values come from the central registry and versions.json.
name: ci

on: [push, pull_request]

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: sirloinbh/project-standards/.github/workflows/reusable-app-ci.yml@3f88e76448dc3c5fcfc207d6dd26d3d31bb06015
    with:
      node-version: '24.21.0'
      npm-version: '11.19.0'
      postgres-image: 'postgres:17-alpine'
      db-name: 'study_test'
      e2e: false
      e2e-visual: false
      playwright-image: 'mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27'
      knip-strict: false
