# 중앙 관리 파일. 수정은 sirloinbh/project-standards의 templates/app/frontend/에서
# API request limit per client IP (#291): 10 requests a second on average, bursts of 40 pass at
# once, more get 429. The API itself has no limit, so this is the only one. This file is
# included inside the http block (/etc/nginx/conf.d/default.conf), where the zone must be.
limit_req_zone $binary_remote_addr zone=api:1m rate=10r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://api:3102;
    proxy_set_header Host $host;
  }
  # Caching for the installable app (docs/pwa.md): hashed build files never change; the service worker,
  # manifest and pages are revalidated on every load. A location with its own add_header drops the
  # server-level ones, so those locations repeat the two security headers.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }
  location ~ ^/(sw\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
}
