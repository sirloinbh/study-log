# 중앙 관리 파일. 수정은 sirloinbh/project-standards의 templates/app/frontend/에서
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://api:3102; proxy_set_header Host $host; }
  # Caching for the installable app (docs/pwa.md): hashed build files never change; the service worker,
  # manifest and pages are revalidated on every load. A location with its own add_header drops the
  # server-level ones, so those locations repeat the two security headers.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }
  location ~ ^/(sw\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
}
